<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
</head>
<body>
  <div class="cadastro-container">
    <div class="cadastro-conteudo">
      <div class="cadastro-textos">
        <h1>Sua história,<br>contada através<br>do que você ama.</h1>
        <p>A rede social para amantes do cinema.</p>
      </div>

      <div class="cadastro-card">
        <div class="campo">
          <label>Nome</label>
          <input type="text">
        </div>
        <div class="campo">
          <label>Endereço de Email</label>
          <input type="email">
        </div>
        <div class="campo">
          <label>Senha</label>
          <input type="password">
        </div>
        <button class="btn-criar">Criar</button>
      </div>
    </div>

    <div class="login-link">
      <p>Já possui uma conta?</p>
      <button routerLink="/login">Entrar</button>
    </div>
  </div>
</body>
</html>
